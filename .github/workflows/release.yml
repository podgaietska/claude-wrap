name: Release

# Pushing a vX.Y.Z tag publishes that version to PyPI and creates its GitHub
# Release. Running the workflow by hand (Actions tab, or `gh workflow run
# release.yml`) is a dry run: it builds and publishes to TestPyPI instead.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the tag is on main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the tag is on main and matches the version and changelog
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not a commit on main"; exit 1; }
          python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: scripts/smoke_test.sh dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/claude-wrap
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, no API token
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a repeated dry run of the same version isn't an error

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-wrap
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, no API token
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
