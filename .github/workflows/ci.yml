name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }} # github.workflow is the caller's name when called
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  # Builds the package and runs it from a clean install (see
  # scripts/smoke_test.sh) to catch files missing from the wheel.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: scripts/smoke_test.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The one check branch protection requires, so the job list can change
  # without touching repo settings. A skipped required check counts as
  # passed, hence `always()` and the explicit result check.
  ci-ok:
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
