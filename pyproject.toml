[project]
name = "claude-wrap"
version = "0.1.0"
description = "Cost-aware model routing and semantic caching proxy for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cache = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff==0.17.0",
]

[project.scripts]
wrap = "wrap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrap"]

[tool.pytest.ini_options]
markers = ["slow: timing benchmarks; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter wraps code; lines it leaves long are strings and comments.
ignore = ["E501"]
