[project]
name = "claude-wrap"
version = "0.2.0"
description = "A model router for Claude Code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mariia Podgaietska" }]
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "anthropic", "llm", "proxy", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff==0.17.0",
]

[project.urls]
Homepage = "https://github.com/podgaietska/claude-wrap"
Repository = "https://github.com/podgaietska/claude-wrap"
Issues = "https://github.com/podgaietska/claude-wrap/issues"

[project.scripts]
wrap = "wrap.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrap"]

[tool.hatch.build.targets.sdist]
include = ["wrap", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
markers = ["slow: timing benchmarks; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter wraps code; lines it leaves long are strings and comments.
ignore = ["E501"]
