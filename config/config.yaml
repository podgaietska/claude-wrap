tiers:
  small:
    model: claude-haiku-4-5-20251001
  large:
    model: claude-sonnet-5

# Verified 2026-10-03 against the Models API and the API's own max_tokens errors.
# If Anthropic lowers a limit, the proxy learns the new value from the 400,
# retries, and logs a warning to update this table.
model_limits:
  claude-haiku-4-5-20251001:
    max_output_tokens: 64000
    context_window: 200000
  claude-sonnet-5:
    max_output_tokens: 128000
    context_window: 1000000
  claude-opus-5-5:
    max_output_tokens: 128000
    context_window: 1000000
  claude-fable-5-1:
    max_output_tokens: 128000
    context_window: 1000000

routing:
  strategy: heuristic
  complexity_threshold: 0.5

cache:
  enabled: false # Phase C
  similarity_threshold: 0.92
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

proxy:
  port: 8787
  upstream_base_url: https://api.anthropic.com
  log_path: data/proxy.log

telemetry:
  db_path: data/wrap.db
  pricing_file: config/pricing.yaml
