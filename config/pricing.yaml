# First-party Claude API rates in USD per million tokens, last checked 2026-10-03.
# Cache writes are 1.25x input for the 5-minute TTL and 2x for the 1-hour TTL.
# Cache reads differ by model: 0.1x input on most, 0.05x on Opus 5.5, 0.025x on Fable 5.1.
# Keys match exactly or as a prefix, so `claude-haiku-4-5` also prices
# `claude-haiku-4-5-20251001`.
models:
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write_5m: 1.25
    cache_write_1h: 2.00
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write_5m: 5.00
    cache_write_1h: 8.00
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
    cache_write_5m: 12.50
    cache_write_1h: 20.00
